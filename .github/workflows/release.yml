name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build signed APK
        run: |
          chmod +x ./build.sh
          ./build.sh
          mkdir -p release
          cp -f build/lightui-release.apk release/lightui-release.apk
          ls -la build/lightui-release.apk release/lightui-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/lightui-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Install `lightui-release.apk` on your Light Phone III / Android device.

            In-app updates: open lightui and choose **update** when prompted.
