name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "cursor/fire-release-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.18)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            # Branch fire trigger: derive tag from branch name cursor/fire-release-1-0-18-*
            branch="${GITHUB_REF_NAME}"
            ver="$(echo "$branch" | sed -n 's/^cursor\/fire-release-\([0-9][0-9]*-[0-9][0-9]*-[0-9][0-9]*\)-.*$/\1/p' | tr '-' '.')"
            if [[ -z "$ver" ]]; then
              echo "Could not derive version from branch: $branch" >&2
              exit 1
            fi
            tag="v${ver}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify release signing secrets
        env:
          LIGHTUI_KEYSTORE_BASE64: ${{ secrets.LIGHTUI_KEYSTORE_BASE64 }}
          LIGHTUI_KEYSTORE_PASSWORD: ${{ secrets.LIGHTUI_KEYSTORE_PASSWORD }}
          LIGHTUI_KEY_ALIAS: ${{ secrets.LIGHTUI_KEY_ALIAS }}
          LIGHTUI_KEY_PASSWORD: ${{ secrets.LIGHTUI_KEY_PASSWORD }}
        run: |
          missing=0
          for name in LIGHTUI_KEYSTORE_BASE64 LIGHTUI_KEYSTORE_PASSWORD LIGHTUI_KEY_ALIAS LIGHTUI_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository secret: $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo >&2
            echo "Add secrets with scripts/upload-signing-keystore.ps1 (or .sh), then re-push the tag." >&2
            exit 1
          fi

      - name: Build signed APK
        env:
          LIGHTUI_REQUIRE_RELEASE_KEYSTORE: "1"
          LIGHTUI_KEYSTORE_BASE64: ${{ secrets.LIGHTUI_KEYSTORE_BASE64 }}
          LIGHTUI_KEYSTORE_PASSWORD: ${{ secrets.LIGHTUI_KEYSTORE_PASSWORD }}
          LIGHTUI_KEY_ALIAS: ${{ secrets.LIGHTUI_KEY_ALIAS }}
          LIGHTUI_KEY_PASSWORD: ${{ secrets.LIGHTUI_KEY_PASSWORD }}
        run: |
          chmod +x ./build.sh
          ./build.sh
          mkdir -p release
          cp -f build/lightui-release.apk release/lightui-release.apk
          ls -la build/lightui-release.apk release/lightui-release.apk
          keytool -printcert -jarfile build/lightui-release.apk | sed -n '1,20p'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            build/lightui-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Install `lightui-release.apk` on your Light Phone III / Android device.

            In-app updates: open lightui → settings → tap the version line → **update**. If the download is cut off, use **browser** on that screen (or open this APK from GitHub in Chrome) and install from Downloads.

            All GitHub Release APKs are signed with the shared lightui release keystore so updates install over previous release builds.
